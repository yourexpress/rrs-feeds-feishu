<img class="hero" src="https://images.ctfassets.net/kftzwdyauwt9/3Iad2h8cMUadlldiZqbsAo/69264040a908479aa8843b590b0015b5/lifeval-social-crayon.png?w=1600&amp;h=900&amp;fit=fill" alt="" referrerpolicy="no-referrer">
<p><strong>核心话题</strong> OpenAI 发布衡量 AI 日常任务（托育、健康、教育、财务、采购、政务服务等）能力的基准 LifeVal。</p>
<p><strong>要点</strong> 以美国与国际时间使用研究为基础，另做 3,995 人代表性调研确定用户最需要 AI 帮助的任务；以完成真实工作流衡量模型。</p>
<p><strong>关键数字</strong> 每周使用 ChatGPT 的用户超 10 亿；新增 3,995 人代表性调研。</p>
<p><strong>为什么值得看</strong> 从学术评测转向测量真实生活任务完成度，指向 agentic 个人助手的评测方向。</p>
